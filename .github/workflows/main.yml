name: Main

on:
  push:
    branches: [main, master]
    tags: ['*']    
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} r-${{ matrix.r }} py-${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        r: [oldrel, latest, devel]
        python: ["3.10", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        exclude:
          - os: windows-11-arm
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ matrix.python }}
      - name: Install rchitect
        run: python -m pip install -e .[dev]
      - name: Configure apt timeouts and retries
        if: matrix.os == 'ubuntu-latest'
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/99timeout
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          Ncpus: 4
      - name: Install libpng-dev
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libpng-dev
      - name: Install reticulate
        run: Rscript -e "install.packages('reticulate')"
      - name: Run tests
        run: pytest -s --cov=rchitect
      - name: codecov
        run: |
          python -m pip install codecov
          codecov
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}

  check_tarball:
    name: Check tarball is installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: 3.13
      - run: |
          python -m pip install build
          python -m build --sdist
          pip install dist/rchitect-*.tar.gz

  build_wheels:
    needs: [pytest, check_tarball]
    name: Build wheels on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  twine:
    name: Upload tarball and wheels
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build_wheels
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: ${{secrets.TWINE_USERNAME}}
      TWINE_PASSWORD: ${{secrets.TWINE_PASSWORD}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: 3.11
      - run: python -m pip install twine build
      - run: |
          python -m build --sdist
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - run: python -m twine upload dist/*

