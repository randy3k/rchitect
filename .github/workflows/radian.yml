name: Test radian

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RADIAN_NO_INPUTHOOK: 1

jobs:
  pytest:
    name: ${{ matrix.os }} r-${{ matrix.r }} py-${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        r: [latest]
        python: ["3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Install libpng-dev
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libpng-dev          
      - name: Install reticulate, askpass, and renv
        run: Rscript -e "install.packages(c('reticulate', 'askpass', 'renv'))"
      - name: Install radian and run tests
        shell: bash
        run: |
          git clone -b "${{ github.head_ref || github.ref_name }}" https://github.com/randy3k/radian ../radian || git clone https://github.com/randy3k/radian ../radian
          python -m pip install -e .[dev]
          python -m pip install -e ../radian[dev]
          python -m pip install jedi
          pytest -s ../radian/tests
